<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambia password - Cronache del Master</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="center">
    <form class="card" id="form" novalidate>
      <h2 id="titolo">Cambia password</h2>
      <p class="muted" id="intro"></p>
      <div id="msg" class="msg" hidden></div>
      <label for="p1">Nuova password (minimo 8 caratteri)</label>
      <input id="p1" type="password" autocomplete="new-password" required minlength="8">
      <label for="p2">Ripeti la nuova password</label>
      <input id="p2" type="password" autocomplete="new-password" required minlength="8">
      <p><button id="go" type="submit" style="width:100%">Salva password</button></p>
      <p class="muted" id="indietro" hidden><a href="index.html">Torna alla home</a></p>
    </form>
  </div>
  <script type="module">
    import { supabase } from "./js/config.js";
    import { requireAuth, showMsg, logout } from "./js/auth.js";

    const profile = await requireAuth({ allowMustChange: true });
    const msg = document.getElementById("msg");
    const go = document.getElementById("go");
    const forced = profile && profile.must_change_password;

    if (profile) {
      document.getElementById("intro").textContent = forced
        ? "Questo e' il tuo primo accesso: scegli una password personale per continuare."
        : "Scegli una nuova password.";
      document.getElementById("indietro").hidden = forced;
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.hidden = true;
      const p1 = document.getElementById("p1").value;
      const p2 = document.getElementById("p2").value;
      if (p1.length < 8) return showMsg(msg, "La password deve avere almeno 8 caratteri");
      if (p1 !== p2) return showMsg(msg, "Le due password non coincidono");
      go.disabled = true;

      const { error } = await supabase.auth.updateUser({ password: p1 });
      if (error) {
        go.disabled = false;
        const same = /different|same/i.test(error.message);
        return showMsg(msg, same ? "La nuova password deve essere diversa da quella attuale" : "Impossibile cambiare la password: " + error.message);
      }
      if (forced) {
        const { error: e2 } = await supabase.rpc("complete_password_change");
        if (e2) {
          go.disabled = false;
          return showMsg(msg, "Password cambiata, ma non e' stato possibile completare l'attivazione. Riprova o contatta l'amministratore.");
        }
      }
      showMsg(msg, "Password aggiornata.", "ok");
      setTimeout(() => location.replace("index.html"), 800);
    });
  </script>
</body>
</html>
