<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronache del Master</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app">
    <h1>Cronache del Master</h1>
    <button id="logout" class="secondary" type="button">Esci</button>
  </header>
  <main>
    <section class="card">
      <h2 id="saluto">Benvenuto</h2>
      <p class="muted">Accesso effettuato. La lobby con le campagne e le avventure arriva nella prossima fase.</p>
      <p>
        <a id="link-admin" class="btn" href="admin-utenti.html" hidden>Gestione utenti</a>
        <a class="btn secondary" style="background:transparent;color:inherit;border:1px solid var(--border)" href="cambia-password.html">Cambia password</a>
      </p>
    </section>
  </main>
  <script type="module">
    import { requireAuth, logout } from "./js/auth.js";
    const profile = await requireAuth();
    if (profile) {
      document.getElementById("saluto").textContent = "Ciao, " + profile.display_name;
      if (profile.role === "admin") document.getElementById("link-admin").hidden = false;
    }
    document.getElementById("logout").addEventListener("click", logout);
  </script>
</body>
</html>
