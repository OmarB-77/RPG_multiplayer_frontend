name: Keep-alive Supabase

# Genera attivita' sul database Supabase del gioco per evitare la pausa per inattivita'.
# Parte ogni giorno e puo' essere lanciato a mano da Actions > Keep-alive Supabase > Run workflow.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://vqedtxdlyxqtwpweytqt.supabase.co
          # Chiave anon: pubblica per progetto, la stessa del sito. La sicurezza e' nelle regole del database.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZWR0eGRseXhxdHdwd2V5dHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNTk4OTIsImV4cCI6MjExMDgzNTg5Mn0.uH5kJWJlZWMjKO849IRICmjO4CbxeXEbT4SW0x9coBo
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping_keep_alive_auto" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          cat response.json
          test "$code" = "200"
